<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Profile Update Test</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 1rem;
        }

        .container {
            background: white;
            border-radius: 10px;
            box-shadow: 0 20px 60px rgba(0, 0, 0, 0.3);
            max-width: 700px;
            width: 100%;
            padding: 2rem;
        }

        h1 {
            color: #333;
            margin-bottom: 1.5rem;
            text-align: center;
        }

        .section {
            margin-bottom: 2rem;
            border: 1px solid #e0e0e0;
            border-radius: 8px;
            padding: 1.5rem;
        }

        .section h2 {
            color: #667eea;
            font-size: 1.1rem;
            margin-bottom: 1rem;
        }

        .form-group {
            margin-bottom: 1rem;
        }

        .form-group label {
            display: block;
            margin-bottom: 0.5rem;
            color: #333;
            font-weight: 500;
        }

        .form-group input {
            width: 100%;
            padding: 0.75rem;
            border: 1px solid #ddd;
            border-radius: 4px;
            font-size: 1rem;
        }

        .form-group input:focus {
            outline: none;
            border-color: #667eea;
            box-shadow: 0 0 0 3px rgba(102, 126, 234, 0.1);
        }

        .status-box {
            padding: 1rem;
            border-radius: 4px;
            margin-bottom: 1rem;
            word-break: break-all;
        }

        .status-box.success {
            background: #d4edda;
            border: 1px solid #28a745;
            color: #155724;
        }

        .status-box.error {
            background: #f8d7da;
            border: 1px solid #dc3545;
            color: #721c24;
        }

        .status-box.info {
            background: #d1ecf1;
            border: 1px solid #0c5460;
            color: #0c5460;
        }

        .buttons {
            display: flex;
            gap: 1rem;
            margin-top: 1rem;
        }

        button {
            flex: 1;
            padding: 0.75rem 1.5rem;
            border: none;
            border-radius: 4px;
            font-size: 1rem;
            cursor: pointer;
            transition: all 0.3s;
        }

        .btn-primary {
            background: #667eea;
            color: white;
        }

        .btn-primary:hover {
            background: #5568d3;
        }

        .btn-secondary {
            background: #6c757d;
            color: white;
        }

        .btn-secondary:hover {
            background: #5a6268;
        }

        .btn-danger {
            background: #dc3545;
            color: white;
        }

        .btn-danger:hover {
            background: #c82333;
        }

        .response-box {
            background: #f5f5f5;
            border: 1px solid #ddd;
            border-radius: 4px;
            padding: 1rem;
            margin-top: 1rem;
            max-height: 300px;
            overflow-y: auto;
            font-family: 'Courier New', monospace;
            font-size: 0.9rem;
            white-space: pre-wrap;
            word-break: break-word;
        }

        .loading {
            display: none;
            text-align: center;
            padding: 1rem;
        }

        .spinner {
            border: 3px solid #f3f3f3;
            border-top: 3px solid #667eea;
            border-radius: 50%;
            width: 30px;
            height: 30px;
            animation: spin 1s linear infinite;
            margin: 0 auto;
        }

        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>🔧 Profile Update Test</h1>

        <div class="section">
            <h2>Step 1: Check Authentication</h2>
            <div id="auth-status" class="status-box info">Checking authentication...</div>
            <button class="btn-primary" onclick="checkAuth()">Check Auth Token</button>
        </div>

        <div class="section">
            <h2>Step 2: Load Current Profile</h2>
            <button class="btn-primary" onclick="loadCurrentProfile()">Load Profile</button>
            <div id="current-profile" class="response-box" style="display:none;"></div>
        </div>

        <div class="section">
            <h2>Step 3: Test Profile Update</h2>
            <div class="form-group">
                <label for="test-name">Name:</label>
                <input type="text" id="test-name" placeholder="Enter new name" value="Test User">
            </div>
            <div class="form-group">
                <label for="test-email">Email:</label>
                <input type="email" id="test-email" placeholder="Enter new email" value="testuser@example.com">
            </div>
            <div class="form-group">
                <label for="test-phone">Phone:</label>
                <input type="text" id="test-phone" placeholder="Enter phone number" value="0712345678">
            </div>
            <div class="buttons">
                <button class="btn-primary" onclick="updateProfile()">Update Profile</button>
                <button class="btn-secondary" onclick="clearResponse()">Clear</button>
            </div>
            <div id="update-response" class="response-box" style="display:none;"></div>
        </div>

        <div class="section">
            <h2>Step 4: Verify Update</h2>
            <button class="btn-primary" onclick="verifyUpdate()">Verify Changes</button>
            <div id="verify-response" class="response-box" style="display:none;"></div>
        </div>

        <div class="loading" id="loading">
            <div class="spinner"></div>
            <p>Loading...</p>
        </div>
    </div>

    <script>
        const showLoading = () => {
            document.getElementById('loading').style.display = 'block';
        };

        const hideLoading = () => {
            document.getElementById('loading').style.display = 'none';
        };

        const checkAuth = async () => {
            const token = localStorage.getItem('authToken');
            const statusBox = document.getElementById('auth-status');

            if (!token) {
                statusBox.className = 'status-box error';
                statusBox.textContent = '❌ No authentication token found.\n\nPlease login first at /login.html';
                return;
            }

            try {
                const response = await fetch('/api/profile', {
                    headers: {
                        'Authorization': `Bearer ${token}`
                    }
                });

                if (response.ok) {
                    statusBox.className = 'status-box success';
                    statusBox.textContent = '✅ Authentication token is valid!\n\nToken: ' + token.substring(0, 50) + '...';
                } else {
                    statusBox.className = 'status-box error';
                    statusBox.textContent = '❌ Token validation failed\n\nStatus: ' + response.status + '\n\nPlease login again.';
                }
            } catch (error) {
                statusBox.className = 'status-box error';
                statusBox.textContent = '❌ Error: ' + error.message;
            }
        };

        const loadCurrentProfile = async () => {
            const token = localStorage.getItem('authToken');
            if (!token) {
                alert('No authentication token. Please login first.');
                return;
            }

            showLoading();
            const box = document.getElementById('current-profile');
            box.style.display = 'block';

            try {
                const response = await fetch('/api/profile', {
                    headers: {
                        'Authorization': `Bearer ${token}`
                    }
                });

                const data = await response.json();

                if (response.ok) {
                    box.textContent = JSON.stringify(data, null, 2);
                    // Pre-fill form with current data
                    document.getElementById('test-name').value = data.user.name;
                    document.getElementById('test-email').value = data.user.email;
                    document.getElementById('test-phone').value = data.user.phone || '';
                } else {
                    box.textContent = 'Error: ' + JSON.stringify(data, null, 2);
                }
            } catch (error) {
                box.textContent = 'Error: ' + error.message;
            } finally {
                hideLoading();
            }
        };

        const updateProfile = async () => {
            const token = localStorage.getItem('authToken');
            if (!token) {
                alert('No authentication token. Please login first.');
                return;
            }

            const name = document.getElementById('test-name').value;
            const email = document.getElementById('test-email').value;
            const phone = document.getElementById('test-phone').value;

            if (!name || !email) {
                alert('Name and email are required');
                return;
            }

            showLoading();
            const box = document.getElementById('update-response');
            box.style.display = 'block';

            try {
                const response = await fetch('/api/profile', {
                    method: 'PUT',
                    headers: {
                        'Content-Type': 'application/json',
                        'Authorization': `Bearer ${token}`
                    },
                    body: JSON.stringify({ name, email, phone })
                });

                const data = await response.json();

                if (response.ok) {
                    box.className = 'response-box';
                    box.textContent = '✅ Profile updated successfully!\n\n' + JSON.stringify(data, null, 2);
                } else {
                    box.className = 'response-box';
                    box.textContent = '❌ Update failed\n\n' + JSON.stringify(data, null, 2);
                }
            } catch (error) {
                box.className = 'response-box';
                box.textContent = '❌ Error: ' + error.message;
            } finally {
                hideLoading();
            }
        };

        const verifyUpdate = async () => {
            const token = localStorage.getItem('authToken');
            if (!token) {
                alert('No authentication token. Please login first.');
                return;
            }

            showLoading();
            const box = document.getElementById('verify-response');
            box.style.display = 'block';

            try {
                const response = await fetch('/api/profile', {
                    headers: {
                        'Authorization': `Bearer ${token}`
                    }
                });

                const data = await response.json();

                if (response.ok) {
                    const expectedName = document.getElementById('test-name').value;
                    const expectedEmail = document.getElementById('test-email').value;
                    const actualName = data.user.name;
                    const actualEmail = data.user.email;

                    if (actualName === expectedName && actualEmail === expectedEmail) {
                        box.className = 'response-box';
                        box.textContent = '✅ Profile update verified!\n\nAll changes have been saved successfully.\n\n' + JSON.stringify(data, null, 2);
                    } else {
                        box.className = 'response-box';
                        box.textContent = '⚠️ Profile data mismatch\n\nExpected:\n' + JSON.stringify({ name: expectedName, email: expectedEmail }, null, 2) + '\n\nActual:\n' + JSON.stringify({ name: actualName, email: actualEmail }, null, 2);
                    }
                } else {
                    box.className = 'response-box';
                    box.textContent = '❌ Verification failed\n\n' + JSON.stringify(data, null, 2);
                }
            } catch (error) {
                box.className = 'response-box';
                box.textContent = '❌ Error: ' + error.message;
            } finally {
                hideLoading();
            }
        };

        const clearResponse = () => {
            document.getElementById('update-response').style.display = 'none';
            document.getElementById('update-response').textContent = '';
        };

        // Check auth on load
        window.addEventListener('load', () => {
            setTimeout(checkAuth, 500);
        });
    </script>
</body>
</html>
