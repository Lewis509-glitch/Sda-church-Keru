<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admin Login - Kerugoya SDA</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600;700&family=Playfair+Display:wght@600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
    <link href='https://unpkg.com/boxicons@2.1.4/css/boxicons.min.css' rel='stylesheet'>
    <link rel="icon" type="image/png" sizes="16x16" href="sda-logo.png">
</head>
<body>
    <div class="top-bar">
        <div>Verse of the Week: <span class="highlight">Exodus 20:8</span></div>
        <div>
            Sunset Today: <span class="highlight" id="sunset-time">18:45 EAT</span> | 
            Sabbath In: <span class="highlight" id="sabbath-countdown">Loading...</span>
        </div>
    </div>

    <nav>
        <a href="#" class="logo">
            <!-- Official SDA Logo SVG from Wikimedia Commons -->
            <img src="sda-logo.png" alt="Seventh-day Adventist Logo">
            <span>Kerugoya Main SDA</span>
        </a>

        
        <div class="menu" id="menu">
            <i class='bx bx-menu-alt-right'></i>
        </div>
        <ul class="nav-links">
            <li><a href="index.html"><i class='bx bxs-home'></i><span>Home</span></a></li>
            <li><a href="about.html"><i class='bx bxs-user'></i><span>About</span></a></li>
            <li><a href="ministries.html"><i class='bx bxs-group'></i><span>Ministries</span></a></li>
            <li><a href="sermons.html"><i class='bx bxs-tv'></i><span>Sermons</span></a></li>
        </ul>
        <div class="announcements">
            <a href="announcements.html"><i class='bx bxs-bell'></i></i></a>
        </div>
        <aside>
            <div class="side-menu">
                <ul>
                    <li class="hidden"><a href="index.html"><i class='bx bxs-user-voice'></i> <span>Leaders</span></a></li>
                    <li class="hidden"><a href="index.html"><i class='bx bxs-calendar'></i> <span></span>Program</span></a></li>
                    <li class="hidden"><a href="about.html"><i class='bx bxs-bible'></i> <span>Prayer</span></a></li>
                    <li><a href="index.html"><i class='bx bxs-photo-album'></i> <span>Gallery</span></a></li>
                    <li><a href="contact.html"><i class='bx bxs-phone'></i> <span>Contact Us</span></a></li>
                </ul>
            </div>
            
        </aside>
    </nav>


    <main class="admin-login-page">
        <section class="card">
            <h1>Admin Login</h1>
            <p>Enter your admin credentials to manage announcements.</p>
            <form id="admin-login-form">
                <div class="form-group">
                    <label for="admin-email">Admin Email</label>
                    <input id="admin-email" type="email" placeholder="admin@example.com" required>
                </div>
                <div class="form-group">
                    <label for="admin-password">Password</label>
                    <input id="admin-password" type="password" placeholder="Enter password" required>
                </div>
                <div class="form-actions">
                    <button type="submit" class="btn">Login</button>
                    <a href="announcements.html" class="btn btn-secondary">Back</a>
                </div>
                <p id="login-status" class="error" style="margin-top: 1rem; display: none;"></p>
            </form>
        </section>
    </main>

    <script src="script.js"></script>
    <script src="admin-login.js"></script>
</body>
</html>
