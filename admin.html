<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admin Console - Announcements</title>
    <link rel="icon" type="image/png" sizes="16x16" href="sda-logo.png">
    <link rel="stylesheet" href="style.css">
    <link href='https://unpkg.com/boxicons@2.1.4/css/boxicons.min.css' rel='stylesheet'>
</head>
<body>
    <header class="top-bar">
        <div><span class="highlight">Admin Console</span></div>
        <div>
            <button id="logoutBtn" class="btn" style="background:#d32f2f;">Logout</button>
            <button id="backBtn" class="btn">Dashboard</button>
        </div>
    </header>

    <main class="admin-panel">
        <section class="card">
            <h1>Manage Announcements</h1>
            <form id="announcement-form">
                <input type="hidden" id="announcement-id" value="">
                <div class="form-group">
                    <label for="announcement-title">Title</label>
                    <input id="announcement-title" type="text" placeholder="Announcement title" required>
                </div>
                <div class="form-group">
                    <label for="announcement-message">Message</label>
                    <textarea id="announcement-message" rows="5" placeholder="Announcement details" required></textarea>
                </div>
                <div class="form-actions">
                    <button type="submit" class="btn">Save Announcement</button>
                    <button type="button" id="cancelEdit" class="btn btn-secondary">Cancel</button>
                </div>
            </form>
        </section>

        <section class="card">
            <h2>Current Announcements</h2>
            <div id="announcement-list" class="announcement-list">
                <p>Loading announcements...</p>
            </div>
        </section>

        <section class="card">
            <h2>Manage Members & Visitors</h2>
            <form id="user-form">
                <input type="hidden" id="user-id" value="">
                <div class="form-group">
                    <label for="user-name">Name</label>
                    <input id="user-name" type="text" placeholder="Full name" required>
                </div>
                <div class="form-group">
                    <label for="user-email">Email</label>
                    <input id="user-email" type="email" placeholder="Email address" required>
                </div>
                <div class="form-group">
                    <label for="user-phone">Phone</label>
                    <input id="user-phone" type="text" placeholder="Phone number">
                </div>
                <div class="form-group">
                    <label for="user-password">Password</label>
                    <input id="user-password" type="password" placeholder="Temporary password" required>
                </div>
                <div class="form-group">
                    <label for="user-status">Role</label>
                    <select id="user-status" required>
                        <option value="member">Member</option>
                        <option value="visitor">Visitor</option>
                    </select>
                </div>
                <div class="form-actions">
                    <button type="submit" class="btn">Add User</button>
                    <button type="button" id="user-cancel" class="btn btn-secondary">Cancel</button>
                </div>
            </form>

            <div id="user-list" class="announcement-list">
                <p>Loading members and visitors...</p>
            </div>
        </section>
    </main>

    <script src="admin.js"></script>
</body>
</html>
